<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethio Exchange — Real-time Ethiopian Bank FX Rates</title>
    <meta
      name="description"
      content="Ethiopia's leading aggregator for real-time foreign exchange rates and banking insights."
    />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ethio Exchange" />
    <meta property="og:title" content="Ethio Exchange — Real-time Ethiopian Bank FX Rates" />
    <meta
      property="og:description"
      content="Ethiopia's leading aggregator for real-time foreign exchange rates and banking insights."
    />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ethio Exchange — Real-time Ethiopian Bank FX Rates" />
    <meta
      name="twitter:description"
      content="Ethiopia's leading aggregator for real-time foreign exchange rates and banking insights."
    />

    <!-- Performance: fonts + image hosts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Structured data for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ethio Exchange",
        "url": "https://ethioexchange.live",
        "description": "Real-time foreign exchange rates from Ethiopian banks."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
