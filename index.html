<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethio Exchange — Real-time Ethiopian Bank FX Rates</title>
    <meta
      name="description"
      content="Ethiopia's leading aggregator for real-time foreign exchange rates and banking insights."
    />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ethioexchange.live/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ethio Exchange" />
    <meta property="og:title" content="Ethio Exchange — Real-time Ethiopian Bank FX Rates" />
    <meta
      property="og:description"
      content="Ethiopia's leading aggregator for real-time foreign exchange rates and banking insights."
    />
    <meta property="og:url" content="https://ethioexchange.live/" />
    <meta property="og:image" content="https://ethioexchange.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ethio Exchange — Real-time Ethiopian Bank FX Rates" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="am_ET" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ethio Exchange — Real-time Ethiopian Bank FX Rates" />
    <meta
      name="twitter:description"
      content="Ethiopia's leading aggregator for real-time foreign exchange rates and banking insights."
    />
    <meta name="twitter:image" content="https://ethioexchange.live/og-image.png" />

    <!-- Performance: fonts + image hosts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Structured data for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://ethioexchange.live/#website",
            "url": "https://ethioexchange.live/",
            "name": "Ethio Exchange",
            "alternateName": "EthioExchange",
            "inLanguage": "en",
            "description": "Real-time foreign exchange rates from Ethiopian banks.",
            "image": "https://ethioexchange.live/og-image.png"
          },
          {
            "@type": "Organization",
            "@id": "https://ethioexchange.live/#organization",
            "name": "Ethio Exchange",
            "alternateName": "EthioExchange",
            "url": "https://ethioexchange.live/",
            "logo": "https://ethioexchange.live/og-image.png",
            "image": "https://ethioexchange.live/og-image.png",
            "description": "Ethiopia's aggregator for real-time foreign exchange rates and banking insights."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
